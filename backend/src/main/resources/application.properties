# Los valores sensibles se pueden definir como variables de entorno (DB_PASSWORD, JWT_SECRET, etc.).
# Si no existen, se usan los valores de desarrollo de la derecha de los dos puntos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/feriapp}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# En produccion definir JWT_SECRET propio (64 caracteres hexadecimales o mas)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
